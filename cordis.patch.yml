# ============================================================================
# dsh-sidebar-fold —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把 dsh-sidebar-fold 插入 profile 的配置树。
#
# 安装方式（无需手工复制、无需手工改 profile patch）：
#   dsh plugin --profile <name> add dsh-sidebar-fold        # npm 发布版
#   dsh plugin --profile <name> add github:you/dsh-sidebar-fold
#   dsh plugin --profile <name> add link:/abs/path/to/dsh-sidebar-fold   # 本地开发
#
# 安装后宿主会自动维护三处登记（profile/package.json 的 dependencies、
# dsh.profile.bundles 数组、以及 profile 自己的 cordis.patch.yml）。
# ============================================================================

- insert:
    - id: dsh-sidebar-fold
      name: dsh-sidebar-fold
